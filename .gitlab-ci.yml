stages:
  - test
  - build

test:
  image: python:3.14.5-alpine
  stage: test
  script:
    - pip install --no-cache-dir -r requirements.txt
    - pytest -q

mirror-runtime-image:
  image: docker:29.3.1
  stage: build
  services:
    - docker:29.3.1-dind
  rules:
    - if: $CI_COMMIT_TAG
    - when: never
  script:
    - set -euo pipefail
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker pull "ghcr.io/aleksandr-kotlyar/allure-history-core:$CI_COMMIT_TAG"
    - docker tag "ghcr.io/aleksandr-kotlyar/allure-history-core:$CI_COMMIT_TAG" "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
